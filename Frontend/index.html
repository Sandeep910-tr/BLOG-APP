<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Posts | Editorial</title>
    <!-- Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1419;
            --bg-secondary: #1a1f2e;
            --text-main: #ffffff;
            --text-secondary: #cbd5e0;
            --text-muted: #8b92a0;
            --accent-prime: #ff6b35;
            --accent-secondary: #f7931e;
            --accent-light: #ffa500;
            --accent-hover: #ff5722;
            --border-color: #2d3748;
            --card-bg: #1a1f2e;
            --shadow-sm: 0 2px 8px rgba(255, 107, 53, 0.1);
            --shadow-md: 0 6px 20px rgba(255, 107, 53, 0.15);
            --shadow-lg: 0 12px 40px rgba(255, 107, 53, 0.2);
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
            --max-width: 950px;
            --transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1f2e 50%, #141820 100%);
            color: var(--text-main);
            line-height: 1.6;
            padding: 60px 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(255, 107, 53, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 165, 0, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 100px;
            animation: slideDown 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 3.8rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--accent-prime) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 30px rgba(255, 107, 53, 0.2);
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 700;
            margin-bottom: 25px;
            position: relative;
            padding-bottom: 18px;
        }

        .subtitle::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-prime), transparent);
            border-radius: 2px;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 70px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow {
            0%, 100% { box-shadow: var(--shadow-sm); }
            50% { box-shadow: var(--shadow-md); }
        }

        .post-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 0;
            transition: var(--transition);
            text-decoration: none;
            color: inherit;
            display: block;
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .post-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 107, 53, 0.1), transparent);
            transition: left 0.6s ease;
            z-index: 1;
            pointer-events: none;
        }

        .post-card:hover::before {
            left: 100%;
        }

        .post-card:hover {
            transform: translateY(-12px) rotateX(5deg);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent-prime);
            animation: glow 2s ease-in-out infinite;
        }

        .post-img-container {
            width: 100%;
            height: 500px;
            overflow: hidden;
            background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            position: relative;
        }

        .post-img-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.08) 0%, rgba(255, 165, 0, 0.08) 100%);
            z-index: 1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .post-card:hover .post-img-container::after {
            opacity: 1;
        }

        .post-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: saturate(1);
        }

        .post-card:hover .post-img {
            transform: scale(1.12) rotate(1deg);
            filter: saturate(1.2) brightness(1.05);
        }

        .post-content {
            padding: 45px;
        }

        .post-meta {
            font-size: 0.75rem;
            color: var(--accent-light);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .post-meta::before {
            content: '✦';
            opacity: 1;
            font-size: 1rem;
        }

        .post-title {
            font-family: var(--font-serif);
            font-size: 2.4rem;
            font-weight: 900;
            line-height: 1.15;
            color: var(--text-main);
            margin-bottom: 18px;
            transition: color 0.3s ease;
            letter-spacing: -0.01em;
        }

        .post-card:hover .post-title {
            color: var(--accent-light);
        }

        .post-excerpt {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 28px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.8;
            font-weight: 300;
        }

        .read-more {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--accent-prime);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.1) 0%, rgba(255, 165, 0, 0.05) 100%);
            border-radius: 8px;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border: 1.5px solid rgba(255, 107, 53, 0.3);
            position: relative;
            overflow: hidden;
        }

        .read-more::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 107, 53, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .read-more::after {
            content: '→';
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .post-card:hover .read-more {
            background: linear-gradient(135deg, var(--accent-prime) 0%, var(--accent-secondary) 100%);
            color: white;
            border-color: var(--accent-prime);
            padding: 12px 24px;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .post-card:hover .read-more::before {
            left: 100%;
        }

        .post-card:hover .read-more::after {
            transform: translateX(6px);
        }

        .loading {
            text-align: center;
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 1.3rem;
            color: var(--text-muted);
            padding: 120px 0;
            animation: fadeInUp 0.6s ease forwards;
        }

        .loading::after {
            content: '';
            display: block;
            margin-top: 25px;
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-prime);
            border-radius: 50%;
            animation: spinGlow 1.5s linear infinite;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 0 15px rgba(255, 107, 53, 0.3);
        }

        @keyframes spinGlow {
            to { transform: rotate(360deg); }
        }

        .error {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.15) 0%, rgba(255, 107, 53, 0.05) 100%);
            color: #ff9999;
            padding: 35px;
            border-radius: 16px;
            border: 2px solid var(--accent-prime);
            text-align: center;
            box-shadow: var(--shadow-lg);
            animation: slideDown 0.6s ease forwards;
        }

        .error strong {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--accent-light);
        }

        @media (max-width: 768px) {
            h1 { 
                font-size: 2.6rem; 
            }
            .post-title { 
                font-size: 1.8rem; 
            }
            .post-img-container { 
                height: 350px; 
            }
            body { 
                padding: 50px 15px; 
            }
            .post-content {
                padding: 32px;
            }
            header {
                margin-bottom: 70px;
            }
            .post-card:hover {
                transform: translateY(-10px);
            }
        }

        @media (max-width: 480px) {
            h1 { 
                font-size: 2rem; 
            }
            .post-title { 
                font-size: 1.5rem; 
            }
            .subtitle {
                font-size: 0.85rem;
            }
            .post-content {
                padding: 24px;
            }
            .post-img-container {
                height: 280px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="subtitle">The Daily Journal</div>
            <h1>Editorial Postings</h1>
        </header>

        <main id="posts-container" class="posts-grid">
            <div class="loading">Fetching the latest stories...</div>
        </main>
    </div>

    <script>
        async function loadPosts() {
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts');
                let posts = await response.json();
                posts = posts.slice(0, 20);

                const container = document.getElementById('posts-container');
                container.innerHTML = '';

                posts.forEach((post, index) => {
                    const postLink = document.createElement('a');
                    postLink.className = 'post-card';
                    postLink.href = `post-detail.html?id=${post.id}`;
                    // Staggered animation delay (max 2s limit for very long lists)
                    const delay = Math.min(index * 0.1, 2);
                    postLink.style.animationDelay = `${delay}s`;
                    
                    const imageUrl = `https://picsum.photos/900/600?random=${post.id}`;
                    
                    postLink.innerHTML = `
                        <div class="post-img-container">
                            <img class="post-img" src="${imageUrl}" alt="${post.title}" loading="lazy">
                        </div>
                        <div class="post-content">
                            <div class="post-meta">Story ID: ${post.id} • Author ${post.userId}</div>
                            <h2 class="post-title">${post.title}</h2>
                            <p class="post-excerpt">${post.body}</p>
                            <div class="read-more">Read Full Story</div>
                        </div>
                    `;
                    container.appendChild(postLink);
                });
            } catch (error) {
                document.getElementById('posts-container').innerHTML = `
                    <div class="error">
                        <strong>Unable to load stories.</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }

        loadPosts();
    </script>
</body>

</html>
