<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Detail | Editorial</title>
    <!-- Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1419;
            --bg-secondary: #1a1f2e;
            --text-main: #ffffff;
            --text-secondary: #cbd5e0;
            --text-muted: #8b92a0;
            --accent-prime: #ff6b35;
            --accent-secondary: #f7931e;
            --accent-light: #ffa500;
            --accent-hover: #ff5722;
            --border-color: #2d3748;
            --card-bg: #1a1f2e;
            --shadow-sm: 0 2px 8px rgba(255, 107, 53, 0.1);
            --shadow-md: 0 6px 20px rgba(255, 107, 53, 0.15);
            --shadow-lg: 0 12px 40px rgba(255, 107, 53, 0.2);
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
            --max-width: 850px;
            --transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1f2e 50%, #141820 100%);
            color: var(--text-main);
            line-height: 1.8;
            padding: 60px 20px;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(255, 107, 53, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 165, 0, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            animation: fadeInUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            position: relative;
            z-index: 1;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 50px;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: var(--transition);
            padding: 10px 16px;
            border-radius: 8px;
            background: rgba(255, 107, 53, 0.08);
            border: 1px solid rgba(255, 107, 53, 0.2);
        }
        
        .back-link:hover {
            color: var(--accent-light);
            background: rgba(255, 107, 53, 0.15);
            border-color: var(--accent-prime);
            transform: translateX(-6px) translateY(-2px);
        }

        .back-link::before {
            content: '←';
            margin-right: 10px;
            font-size: 1.2em;
        }
        
        .post-header {
            margin-bottom: 50px;
        }
        
        .post-meta {
            font-size: 0.75rem;
            color: var(--accent-light);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .post-meta::before {
            content: '✦';
            opacity: 1;
            font-size: 1rem;
        }
        
        .post-title {
            font-family: var(--font-serif);
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1.15;
            margin-bottom: 28px;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, var(--accent-prime) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .post-author-box {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.95rem;
            color: var(--text-secondary);
            border-top: 2px solid var(--border-color);
            border-bottom: 2px solid var(--border-color);
            padding: 20px 0;
            margin-bottom: 45px;
            flex-wrap: wrap;
        }

        .author-name {
            color: var(--accent-light);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .post-image-container {
            margin: 50px 0;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            group: 'image';
        }
        
        .post-image-container img {
            width: 100%;
            height: auto;
            display: block;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
            border-radius: 16px;
            filter: brightness(0.95);
        }

        .post-image-container:hover img {
            transform: scale(1.08) rotate(-1deg);
            filter: brightness(1.1) saturate(1.15);
        }
        
        .post-body {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-top: 45px;
            white-space: pre-line;
            font-family: var(--font-sans);
            line-height: 2;
            letter-spacing: 0.4px;
            font-weight: 300;
        }

        /* Comments Section Styling */
        .comments-header {
            margin-top: 100px;
            margin-bottom: 50px;
            padding-top: 50px;
            border-top: 3px solid var(--accent-prime);
            position: relative;
        }

        .comments-header::before {
            content: '✦';
            position: absolute;
            left: 0;
            top: -18px;
            font-size: 1.8rem;
            color: var(--accent-light);
        }

        .comments-title {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent-prime) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .comment {
            margin-bottom: 32px;
            padding: 28px;
            border-radius: 12px;
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
            position: relative;
            overflow: hidden;
        }

        .comment::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-prime), transparent);
            transition: left 0.5s ease;
        }

        .comment:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--accent-prime);
            transform: translateX(8px);
        }

        .comment:hover::before {
            left: 100%;
        }

        .comment:last-child {
            margin-bottom: 0;
        }

        .comment-header {
            margin-bottom: 14px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .comment-author {
            font-weight: 800;
            color: var(--text-main);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .comment-email {
            font-size: 0.75rem;
            color: var(--accent-light);
            font-weight: 700;
            background: rgba(255, 107, 53, 0.12);
            padding: 6px 12px;
            border-radius: 6px;
            white-space: nowrap;
            border: 1px solid rgba(255, 107, 53, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .comment-body {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.9;
            margin-top: 12px;
            font-weight: 300;
        }
        
        .loading {
            text-align: center;
            padding: 120px 0;
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 1.3rem;
            color: var(--text-muted);
            animation: fadeInUp 0.6s ease forwards;
        }

        .loading::after {
            content: '';
            display: block;
            margin-top: 25px;
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-prime);
            border-radius: 50%;
            animation: spinGlow 1.5s linear infinite;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.4);
        }

        @keyframes spinGlow {
            to { transform: rotate(360deg); }
        }
        
        .error {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.15) 0%, rgba(255, 107, 53, 0.05) 100%);
            color: #ffb3a3;
            border-radius: 16px;
            border: 2px solid var(--accent-prime);
            padding: 40px;
            box-shadow: var(--shadow-lg);
            animation: fadeInUp 0.6s ease forwards;
        }

        .error strong {
            display: block;
            font-size: 1.3rem;
            margin-bottom: 12px;
            color: var(--accent-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        @media (max-width: 768px) {
            .post-title { 
                font-size: 2.4rem; 
            }
            body { 
                padding: 50px 15px; 
            }
            .post-author-box {
                gap: 10px;
            }
            .comments-title {
                font-size: 1.8rem;
            }
            .comment {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .post-title { 
                font-size: 1.8rem; 
            }
            .post-body {
                font-size: 1rem;
            }
            .comment {
                padding: 16px;
            }
            .comments-header {
                margin-top: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="index.html" class="back-link">Back to Journal</a>
        </nav>
        
        <main id="post-content-container">
            <div class="loading">Preparing the article...</div>
        </main>

        <section id="comments-section-container" style="display: none;">
            <div class="comments-header">
                <h2 id="comments-title-count" class="comments-title">Comments</h2>
            </div>
            <div id="comments-list">
                <!-- Comments will be loaded here -->
            </div>
        </section>
    </div>

    <script>
        async function loadPostDetail() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const postId = urlParams.get('id');
                
                if (!postId) {
                    throw new Error('No article ID provided.');
                }
                
                // Fetch post details first
                const postResponse = await fetch(`https://jsonplaceholder.typicode.com/posts/${postId}`);
                if (!postResponse.ok) throw new Error('Article not found or moved.');
                const post = await postResponse.json();
                
                // Fetch user info
                let authorFullInfo = `Author ID: ${post.userId}`;
                try {
                    const userResponse = await fetch(`https://jsonplaceholder.typicode.com/users/${post.userId}`);
                    if (userResponse.ok) {
                        const user = await userResponse.json();
                        authorFullInfo = `By <span class="author-name">${user.name}</span> • @${user.username}`;
                    }
                } catch (e) {
                     console.error("User fetch failed", e);
                }
                
                // Fetch comments
                const commentsResponse = await fetch(`https://jsonplaceholder.typicode.com/posts/${postId}/comments`);
                const comments = await commentsResponse.json();
                
                // Image URL
                const imageUrl = `https://picsum.photos/1200/800?random=${postId}`;
                
                const contentContainer = document.getElementById('post-content-container');
                contentContainer.innerHTML = `
                    <article>
                        <header class="post-header">
                            <div class="post-meta">Story ID: ${post.id} • Archive</div>
                            <h1 class="post-title">${post.title}</h1>
                            <div class="post-author-box">
                                ${authorFullInfo}
                            </div>
                        </header>
                        
                        <div class="post-image-container">
                            <img src="${imageUrl}" alt="${post.title}">
                        </div>
                        
                        <div class="post-body">
                            ${post.body}
                        </div>
                    </article>
                `;

                // Render Comments
                const commentsSection = document.getElementById('comments-section-container');
                const commentsList = document.getElementById('comments-list');
                const commentsTitle = document.getElementById('comments-title-count');
                
                commentsSection.style.display = 'block';
                commentsTitle.innerText = `Discussion (${comments.length})`;
                
                let commentsHtml = '';
                comments.forEach((comment, index) => {
                    const delay = 0.5 + Math.min(index * 0.1, 1);
                    commentsHtml += `
                        <div class="comment" style="opacity: 0; animation: fadeInUp 0.6s ease forwards; animation-delay: ${delay}s">
                            <div class="comment-header">
                                <div class="comment-author">${comment.name}</div>
                                <div class="comment-email">${comment.email}</div>
                            </div>
                            <div class="comment-body">${comment.body}</div>
                        </div>
                    `;
                });
                commentsList.innerHTML = commentsHtml;

            } catch (error) {
                document.getElementById('post-content-container').innerHTML = `
                    <div class="error">
                        <strong>Something went wrong.</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }

        loadPostDetail();
    </script>
</body>
</html>
